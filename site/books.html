<!doctype html>
<html lang="zh-CN" data-theme="dawn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>66 卷逐卷 · CCstudy</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.filters{position:sticky;top:48px;z-index:30;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.search{width:100%;max-width:360px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.bk h3{margin:0}
.bk .meta{font-size:.82rem;color:var(--sub)}
.bk dl{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;margin-top:10px}
.bk dt{font-weight:800;color:var(--acc2);font-size:.88rem}
.bk dd{margin:0}
@media(max-width:560px){.bk dl{grid-template-columns:1fr}.bk dt{margin-top:6px}}
.gbar{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:10px 0}
.gbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer;transition:filter .2s}
.gbar div:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="prog"></div>
<header class="top">
  <button class="btn" id="tocBtn">☰ 目录</button>
  <h1>📚 66 卷逐卷解读</h1>
  <a class="btn" href="index.html">📖 全景</a>
  <a class="btn" href="creeds.html">📜 信经</a>
  <a class="btn" href="classic.html" title="v1 单文件经典版">🏛️ 经典版</a>
  <div class="themes">
    <span class="sw" data-t="dawn" style="background:#b5562b"></span>
    <span class="sw" data-t="night" style="background:#1b2236"></span>
    <span class="sw" data-t="olive" style="background:#4f7a1f"></span>
    <span class="sw" data-t="royal" style="background:#6b3fb5" title="君王紫"></span>
    <span class="sw" data-t="ocean" style="background:#0e7490" title="海洋"></span>
    <span class="sw" data-t="sakura" style="background:#c2185b" title="樱花"></span>
    <span class="sw" data-t="ink" style="background:#1b1b1b" title="水墨"></span>
  </div>
</header>
<div class="wrap">
<nav class="toc" id="toc"></nav>
<main>
<div class="hero reveal"><h2>每一卷书，问同样七个问题</h2>
<p>为什么写 → 结构 → 核心 → 怎样指向基督 → 难点 → 相关信条 → 应用。再用一句口诀记住它。</p></div>
<div class="card reveal legend"><b>🎨 标记：</b><span class="k">核心概念</span><span class="m">必背</span><span class="u1">关键词</span><span class="u2">次重点</span><span class="u3">难点</span></div>
<div class="gbar reveal" id="gbar"></div>
<div class="filters">
<input class="search" id="q" placeholder="🔍 搜索书卷、关键词，例如：约、称义、王">
<div class="tabs" id="chips"></div>
</div>
<div id="cards" class="grid" style="display:none"></div>
<div id="list"></div>
<footer>CCstudy · 66 卷 v2.2.0 · 2026-10-22</footer>
</main></div>
<div class="fab"><button class="btn" id="upBtn">↑</button></div>
<script src="assets/books-ot.js"></script>
<script src="assets/books-nt.js"></script>
<script>
(function(){
const B=window.BOOKS,G=['律法','历史','诗歌','大先知','小先知','福音书','保罗书信','普通书信','预言'];
const C={律法:'var(--acc)',历史:'var(--acc2)',诗歌:'var(--acc3)',大先知:'var(--red)',小先知:'#b8860b',福音书:'#d4a017',保罗书信:'#2f6f8f',普通书信:'#5f8a2e',预言:'#6b3fb5'};
const IC={律法:'📜',历史:'🏰',诗歌:'🎵',大先知:'🔥',小先知:'📢',福音书:'✝️',保罗书信:'✉️',普通书信:'📨',预言:'🌅'};
const ot=i=>i<39;
let toc='',list='';
// 分组：旧约历史与新约历史（使徒行传）
const groups=[];B.forEach((b,i)=>{const key=(ot(i)?'旧约·':'新约·')+b.g;let gr=groups.find(x=>x.key===key);if(!gr){gr={key,g:b.g,items:[]};groups.push(gr)}gr.items.push(b)});
groups.forEach(gr=>{
  toc+=`<div class="grp">${IC[gr.g]} ${gr.key}（${gr.items.length}）</div>`;
  list+=`<section id="g-${gr.key}" data-g="${gr.g}"><h2>${IC[gr.g]} ${gr.key} <span class="tag">${gr.items.length} 卷</span></h2>`;
  gr.items.forEach(b=>{
    toc+=`<a href="#${b.id}">${b.n}</a>`;
    list+=`<details class="book bk reveal" id="${b.id}" data-g="${b.g}" data-s="${(b.n+b.k+b.core+b.why+b.mem).replace(/<[^>]+>/g,'')}" style="border-left:5px solid ${C[b.g]}">
<summary><span>${b.n}</span><span class="tag">${b.k}</span><span class="meta">✍️ ${b.a} · 🕰️ ${b.t}</span></summary>
<dl>
<dt>🔑 钥节</dt><dd class="d">${b.v}</dd>
<dt>❓ 为什么写</dt><dd>${b.why}</dd>
<dt>🗂️ 结构</dt><dd>${b.st}</dd>
<dt>🎯 核心</dt><dd><div class="box key" style="margin:0">${b.core}</div></dd>
<dt>✝️ 指向基督</dt><dd>${b.cx}</dd>
<dt>⚠️ 难点</dt><dd>${b.hard}</dd>
<dt>📜 信条</dt><dd>${b.cf}</dd>
<dt>🌱 应用</dt><dd>${b.app}</dd>
<dt>🧠 口诀</dt><dd><span class="m">${b.mem}</span></dd>
</dl></details>`});
  list+='</section>'});
document.getElementById('toc').innerHTML=toc;document.getElementById('list').innerHTML=list;
// 分布条
document.getElementById('gbar').innerHTML=groups.map(gr=>`<div title="${gr.key}" data-n="${gr.items.length}" style="flex:${gr.items.length};background:${C[gr.g]}" onclick="location.hash='g-${gr.key}'">${gr.items.length>3?gr.g+gr.items.length:gr.items.length}</div>`).join('');
// 过滤
const chips=document.getElementById('chips');chips.innerHTML='<button class="btn on" data-g="">全部 66</button>'+G.map(g=>`<button class="btn" data-g="${g}">${IC[g]} ${g}</button>`).join('')+'<button class="btn" id="openAll">展开全部</button><button class="btn" id="flashBtn">🃏 闪卡模式</button>';
let cur='';const apply=()=>{const q=document.getElementById('q').value.trim();
  document.querySelectorAll('.bk').forEach(d=>{const ok=(!cur||d.dataset.g===cur)&&(!q||d.dataset.s.includes(q));d.style.display=ok?'':'none';if(q&&ok)d.open=true;d.classList.add('in')});
  document.querySelectorAll('#list section').forEach(s=>s.style.display=[...s.querySelectorAll('.bk')].some(d=>d.style.display!=='none')?'':'none')};
chips.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{cur=b.dataset.g;chips.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b));apply()});
document.getElementById('openAll').onclick=e=>{const o=e.target.classList.toggle('on');document.querySelectorAll('.bk').forEach(d=>d.open=o);e.target.textContent=o?'收起全部':'展开全部'};
document.getElementById('q').oninput=apply;
const cards=document.getElementById('cards');
cards.innerHTML=B.map(b=>`<div class="flash" data-g="${b.g}"><div class="in"><div class="f" style="background:linear-gradient(135deg,${C[b.g]},var(--acc2))"><b style="font-size:1.4rem">${b.n}</b><span style="opacity:.9">${b.k}</span><small style="opacity:.8">${IC[b.g]} ${b.g} · 点我翻面</small></div><div class="bk"><div style="font-size:.9rem">${b.core}</div><div style="margin-top:8px"><span class="m">${b.mem}</span></div></div></div></div>`).join('');
document.getElementById('flashBtn').onclick=e=>{const on=e.target.classList.toggle('on');cards.style.display=on?'':'none';document.getElementById('list').style.display=on?'none':'';};
})();
</script>
<script src="assets/lenis.min.js"></script>
<script src="assets/app.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圣经全解 · 欧陆改革宗｜时间线 · 列王 · 故事线 · 圣经神学 · 圣约神学</title>
<meta name="description" content="从三大普世信经与三项联合信条出发，以时间线、故事线、圣经神学与圣约神学四条轴线解读整本圣经六十六卷；含四十二位王的双轨年表、地图与流程图，以及覆盖全站的记忆引擎。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231b2c49'/%3E%3Cpath d='M16 5.5v21M9 9.5h14' stroke='%23c9a34e' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ═══════════ 令牌 ═══════════ */
:root{
  --parch:#f4eddd; --parch-2:#ece2cc; --card:#fbf7ec; --card-2:#f5eede;
  --ink:#221f1a; --ink-2:#4f4739; --ink-3:#7d7362;
  --navy:#1b2c49; --burg:#7a2230; --gold:#9a7524; --gold-l:#c9a34e;
  --rule:#ddd0b3; --rule-2:#c8b791;
  --teal:#265c58; --violet:#4a3869; --rust:#8d4a1f; --olive:#575a22; --green:#2c5c31;
  --brown:#6b4423; --plum:#6d2a54;
  --sh-1:0 1px 2px rgba(70,52,20,.06);
  --sh-2:0 4px 14px -8px rgba(70,52,20,.38);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --lat:"EB Garamond","Adobe Garamond Pro",Garamond,Georgia,"Times New Roman",serif;
  --cn:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --disp:"Cinzel","Trajan Pro","EB Garamond",Georgia,var(--cn),serif;
  --body:var(--lat),var(--cn),serif;
  --maxw:76ch; --pad:clamp(1rem,3.2vw,3.2rem); --tocw:clamp(232px,20vw,296px);
}
:root[data-theme="dark"]{
  --parch:#16140f; --parch-2:#1e1b14; --card:#221e16; --card-2:#292317;
  --ink:#ece3cd; --ink-2:#c6bca3; --ink-3:#978d77;
  --navy:#93b4e0; --burg:#e28d97; --gold:#d9b45f; --gold-l:#e8cd8a;
  --rule:#3a3326; --rule-2:#4e452f;
  --teal:#6fb5ae; --violet:#b3a3dd; --rust:#dd9a63; --olive:#b1b05a; --green:#78b67d;
  --brown:#c9976a; --plum:#d68fbe;
  --sh-1:0 1px 2px rgba(0,0,0,.45); --sh-2:0 5px 16px -9px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:74px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;overflow-x:hidden;background:var(--parch);color:var(--ink);
  font-family:var(--body);font-size:17.5px;line-height:1.85;
  font-feature-settings:"kern","liga";text-rendering:optimizeLegibility;
}
:root[data-theme="light"] body{
  background-image:radial-gradient(ellipse 110% 70% at 12% -8%,rgba(201,163,78,.12),transparent 58%);
  background-attachment:fixed;
}
.cn,:lang(zh){font-family:var(--cn),var(--lat),serif}
.lat,.gr{font-family:var(--lat);font-style:italic;color:var(--navy)}
::selection{background:rgba(201,163,78,.45)}
a{color:var(--navy);text-underline-offset:3px;text-decoration-thickness:.06em}
a:hover{color:var(--burg)}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:3px}
img,svg{max-width:100%}

/* ═══════════ 骨架 + 可隐藏目录 ═══════════ */
.wrap{display:grid;grid-template-columns:var(--tocw) minmax(0,1fr);max-width:1620px;margin:0 auto;
  transition:grid-template-columns .28s cubic-bezier(.4,0,.2,1)}
.wrap[data-toc="off"]{grid-template-columns:0 minmax(0,1fr)}
.sidebar{
  position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--rule);padding:1rem .75rem 4rem 1.2rem;background:var(--parch-2);
  scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent;
  transition:opacity .2s,transform .28s cubic-bezier(.4,0,.2,1);contain:layout paint
}
.wrap[data-toc="off"] .sidebar{opacity:0;transform:translateX(-14px);pointer-events:none;overflow:hidden}
.sidebar::-webkit-scrollbar{width:7px}
.sidebar::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:9px}
main{min-width:0;padding:0 var(--pad) 7rem}

/* ═══════════ 顶栏 ═══════════ */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.45rem;
  padding:.45rem var(--pad);margin:0 calc(-1*var(--pad));
  background:color-mix(in srgb,var(--parch) 92%,transparent);border-bottom:1px solid var(--rule)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--gold-l),var(--burg));width:0;transition:width .12s linear}
.crumb{font-family:var(--disp);font-size:.76rem;letter-spacing:.09em;color:var(--ink-3);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{appearance:none;border:1px solid var(--rule-2);background:var(--card);color:var(--ink-2);border-radius:999px;
  padding:.26rem .7rem;font-family:var(--disp);font-size:.74rem;letter-spacing:.05em;cursor:pointer;
  line-height:1.75;white-space:nowrap;transition:border-color .14s,color .14s,background .14s}
.btn:hover{border-color:var(--gold);color:var(--burg)}
.btn[aria-pressed="true"]{background:var(--navy);color:#f3ecd8;border-color:var(--navy)}
:root[data-theme="dark"] .btn[aria-pressed="true"]{background:#27395a;color:#ece3cd}
kbd{font-family:var(--mono);font-size:.68em;border:1px solid var(--rule-2);border-bottom-width:2px;
  border-radius:4px;padding:0 .3em;color:var(--ink-3);background:var(--card)}

/* ═══════════ 目录 ═══════════ */
.toc-head{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin:.1rem 0 .8rem}
.toc-head b{font-family:var(--disp);font-size:.7rem;letter-spacing:.2em;color:var(--ink-3);font-weight:600}
.toc{list-style:none;margin:0;padding:0;font-size:.85rem;line-height:1.5}
.toc li{margin:0}
.toc a{display:block;padding:.28rem .5rem .28rem .55rem;color:var(--ink-2);text-decoration:none;
  border-left:2px solid transparent;border-radius:0 4px 4px 0}
.toc a:hover{background:rgba(201,163,78,.16);color:var(--ink)}
.toc a.on{color:var(--burg);border-left-color:var(--gold);background:rgba(201,163,78,.2);font-weight:700}
.toc .grp{display:flex;align-items:center;gap:.1rem;margin-top:.12rem}
.toc .grp > a{flex:1;font-family:var(--disp);font-size:.82rem;letter-spacing:.02em}
.toc .tg{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-3);padding:.1rem .3rem;
  font-size:.66rem;line-height:1;border-radius:4px}
.toc .tg:hover{color:var(--burg);background:rgba(201,163,78,.16)}
.toc .tg::before{content:"▸";display:inline-block;transition:transform .18s}
.toc li[data-open="1"] > .grp .tg::before{transform:rotate(90deg)}
.toc .sub{list-style:none;margin:.05rem 0 .4rem;padding:0 0 0 .5rem;border-left:1px solid var(--rule);
  overflow:hidden;max-height:0;transition:max-height .24s ease}
.toc li[data-open="1"] > .sub{max-height:56rem}
.toc .sub a{font-size:.78rem;padding-left:.5rem;color:var(--ink-3)}

/* ═══════════ 搜索浮层 ═══════════ */
.pal{position:fixed;inset:0;z-index:90;display:none;padding:9vh 1rem 1rem;background:rgba(24,18,6,.42)}
.pal.open{display:block}
.pal-box{max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--rule-2);border-radius:14px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.6);overflow:hidden}
.pal-box input{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;color:var(--ink);
  font-family:var(--cn);font-size:1rem;padding:.9rem 1.1rem}
.pal-box input:focus{outline:none}
.pal-list{max-height:min(56vh,440px);overflow-y:auto;margin:0;padding:.35rem;list-style:none}
.pal-list li{margin:0}
.pal-list button{width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:.5rem .75rem;
  border-radius:8px;display:flex;gap:.6rem;align-items:baseline;font:inherit;color:var(--ink)}
.pal-list button:hover,.pal-list button.sel{background:rgba(201,163,78,.2)}
.pal-list .t{font-family:var(--cn);font-size:.92rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-list .c{font-family:var(--disp);font-size:.66rem;letter-spacing:.1em;color:var(--ink-3);white-space:nowrap}
.pal-foot{border-top:1px solid var(--rule);padding:.4rem .9rem;font-size:.72rem;color:var(--ink-3)}

/* ═══════════ 扉页 ═══════════ */
.hero{padding:clamp(2.2rem,6.5vw,4.8rem) 0 2rem;border-bottom:2px solid var(--rule)}
.hero .kick{font-family:var(--disp);letter-spacing:.28em;font-size:.7rem;color:var(--gold);margin-bottom:1rem}
.hero h1{font-family:var(--disp);font-weight:700;font-size:clamp(2rem,5.6vw,3.7rem);line-height:1.08;margin:0 0 .35rem;color:var(--navy)}
.hero .sub{font-family:var(--lat);font-style:italic;font-size:clamp(.98rem,2.2vw,1.42rem);color:var(--burg);margin:0 0 1.3rem}
.hero .lede{max-width:62ch;font-size:1.04rem;color:var(--ink-2)}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(168px,100%),1fr));gap:.6rem;margin:1.7rem 0 .4rem}
.axis{border:1px solid var(--rule);border-top:3px solid var(--ax,var(--gold));background:var(--card);border-radius:9px;padding:.7rem .85rem;box-shadow:var(--sh-1)}
.axis b{display:block;font-family:var(--disp);font-size:.94rem;color:var(--ink);margin-bottom:.15rem}
.axis span{font-size:.82rem;color:var(--ink-3);line-height:1.55;display:block}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.2rem}
.pill{font-size:.74rem;font-family:var(--disp);letter-spacing:.05em;border:1px solid var(--rule-2);
  padding:.2rem .65rem;border-radius:999px;color:var(--ink-3);background:var(--card)}

/* ═══════════ 标题 ═══════════ */
.part{padding-top:2.9rem;margin-top:2.2rem;border-top:1px solid var(--rule);scroll-margin-top:74px}
.pnum{font-family:var(--disp);font-size:.74rem;letter-spacing:.22em;color:var(--gold)}
h2{font-family:var(--disp);font-size:clamp(1.5rem,3.5vw,2.25rem);color:var(--navy);margin:.1rem 0 .3rem;line-height:1.2;font-weight:700}
h3{font-family:var(--disp);font-size:clamp(1.1rem,2.4vw,1.38rem);color:var(--burg);margin:2.2rem 0 .5rem;
  line-height:1.35;font-weight:700;scroll-margin-top:78px}
h3::before{content:"";display:inline-block;width:.4em;height:.4em;border:1.6px solid var(--gold);transform:rotate(45deg);margin-right:.5em;vertical-align:.12em}
h4{font-family:var(--cn);font-size:1.01rem;color:var(--ink);margin:1.4rem 0 .3rem;font-weight:700}
p{margin:.72rem 0;max-width:var(--maxw);overflow-wrap:break-word}
.lead{font-size:1.04rem;color:var(--ink-2);max-width:63ch}
ul,ol{max-width:var(--maxw);padding-left:1.3rem}
li{margin:.28rem 0}
ul.tight li,ol.tight li{margin:.1rem 0}
strong{color:var(--burg);font-weight:700}
em.t{font-style:normal;color:var(--navy);font-weight:600;border-bottom:1.5px dotted var(--gold-l)}
.ref{font-family:var(--disp);font-size:.78rem;color:var(--gold);letter-spacing:.05em;white-space:nowrap}

/* ═══════════ 块 ═══════════ */
.box{border-left:4px solid var(--gold);background:var(--card);padding:.9rem 1.1rem;margin:1.2rem 0;
  border-radius:0 7px 7px 0;box-shadow:var(--sh-1);max-width:var(--maxw)}
.box.navy{border-left-color:var(--navy)} .box.burg{border-left-color:var(--burg)}
.box.teal{border-left-color:var(--teal)} .box.green{border-left-color:var(--green)}
.box h4{margin-top:0}
.tag{font-family:var(--disp);font-size:.68rem;letter-spacing:.17em;color:var(--ink-3);display:block;margin-bottom:.25rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(256px,100%),1fr));gap:.9rem;margin:1.2rem 0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(196px,100%),1fr));gap:.8rem;margin:1.2rem 0}
.mini{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:.8rem .95rem;box-shadow:var(--sh-1);contain:layout style}
.mini h4{margin:.05rem 0 .25rem;font-size:.95rem}
.mini p{font-size:.88rem;margin:.28rem 0;color:var(--ink-2)}
.n{font-family:var(--disp);color:var(--gold);font-size:.7rem;letter-spacing:.16em}

/* ═══════════ 表 ═══════════ */
.tw{overflow-x:auto;margin:1.3rem 0;border:1px solid var(--rule);border-radius:9px;background:var(--card);
  box-shadow:var(--sh-1);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:520px}
caption{caption-side:top;text-align:left;padding:.65rem .9rem .05rem;font-family:var(--disp);font-size:.78rem;letter-spacing:.08em;color:var(--ink-3)}
th,td{padding:.52rem .75rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
thead th{background:var(--navy);color:#f3ecd8;font-family:var(--disp);font-size:.76rem;letter-spacing:.04em;font-weight:600}
:root[data-theme="dark"] thead th{background:#223553;color:#e8dfc4}
tbody tr:nth-child(even){background:rgba(0,0,0,.022)}
:root[data-theme="dark"] tbody tr:nth-child(even){background:rgba(255,255,255,.028)}
tbody tr:last-child td{border-bottom:0}
td.k{font-weight:700;color:var(--ink);white-space:nowrap}
table.cmp{font-size:.82rem} table.cmp th,table.cmp td{padding:.38rem .58rem}

/* ═══════════ 图 ═══════════ */
figure{margin:1.6rem 0}
figure svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--sh-1)}
figcaption{font-size:.81rem;color:var(--ink-3);margin-top:.5rem;font-family:var(--cn);max-width:var(--maxw)}
figcaption b{color:var(--ink-2)}
svg text{font-family:var(--cn),var(--lat)}

/* ═══════════ 时间轴 ═══════════ */
.era-bar{display:flex;flex-wrap:wrap;gap:.35rem;margin:1rem 0 .6rem}
.era{cursor:pointer;border:1px solid var(--rule-2);background:var(--card);border-radius:999px;padding:.24rem .68rem;
  font-family:var(--cn);font-size:.79rem;color:var(--ink-2)}
.era:hover{border-color:var(--gold)}
.era[aria-pressed="true"]{background:var(--ec,var(--navy));color:#f6efdc;border-color:var(--ec,var(--navy))}
.tl{position:relative;margin:1rem 0 1.4rem;padding-left:1.35rem}
.tl::before{content:"";position:absolute;left:5px;top:.4rem;bottom:.4rem;width:2px;background:var(--rule-2);border-radius:2px}
.ev{position:relative;padding:.1rem 0 .85rem .1rem}
.ev::before{content:"";position:absolute;left:-1.35rem;top:.62rem;width:11px;height:11px;border-radius:50%;
  background:var(--parch);border:2.6px solid var(--ec,var(--gold))}
.ev.hide{display:none}
.ev .yr{font-family:var(--disp);font-size:.76rem;letter-spacing:.06em;color:var(--ec,var(--gold));margin-right:.5rem}
.ev .ti{font-family:var(--cn);font-weight:700;font-size:.97rem;color:var(--ink)}
.ev .de{font-size:.87rem;color:var(--ink-2);margin:.1rem 0 .15rem;max-width:var(--maxw)}
.ev .mt{font-size:.75rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:.1rem .9rem}
.ev .mt span::before{content:"· ";color:var(--rule-2)}

/* ═══════════ 66 卷 ═══════════ */
.filters{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:1rem 0 .8rem}
.chip{appearance:none;cursor:pointer;border:1px solid var(--rule-2);background:var(--card);color:var(--ink-2);
  font-family:var(--cn);font-size:.79rem;padding:.24rem .64rem;border-radius:999px}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--navy);color:#f4edd9;border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:#27395a;color:#ece3cd}
.sbox{flex:1;min-width:150px;max-width:300px}
.sbox input{width:100%;font-family:var(--cn);font-size:.85rem;padding:.32rem .78rem;border-radius:999px;
  border:1px solid var(--rule-2);background:var(--card);color:var(--ink)}
.sbox input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,163,78,.25)}
.canon{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(108px,100%),1fr));gap:.4rem;margin:.9rem 0 1.2rem}
.bk{position:relative;text-align:left;cursor:pointer;border:1px solid var(--rule);border-left:4px solid var(--dv,var(--gold));
  background:var(--card);border-radius:6px;padding:.4rem .45rem .42rem;font-family:var(--cn);
  display:flex;flex-direction:column;min-height:54px;transition:transform .13s,border-color .13s;contain:layout style}
.bk:hover{transform:translateY(-2px);border-color:var(--gold)}
.bk .nm{font-size:.9rem;font-weight:700;color:var(--ink);line-height:1.25}
.bk .en{font-family:var(--lat);font-size:.64rem;color:var(--ink-3);font-style:italic}
.bk .ch{position:absolute;right:.3rem;top:.26rem;font-family:var(--mono);font-size:.58rem;color:var(--ink-3);opacity:.75}
.bk[aria-expanded="true"]{background:var(--card-2);border-color:var(--gold)}
.bk.hide{display:none}
.bp{border:1px solid var(--rule);border-top:4px solid var(--dv,var(--gold));background:var(--card);border-radius:9px;
  padding:1rem 1.15rem 1.15rem;margin:.15rem 0 1.5rem;box-shadow:var(--sh-2)}
.bp.empty{color:var(--ink-3);font-size:.89rem;text-align:center;padding:1.5rem;border-top-color:var(--rule)}
.bp h4{margin:0 0 .08rem;font-size:1.28rem;font-family:var(--disp);color:var(--navy)}
.bp .bm{font-size:.76rem;color:var(--ink-3);font-family:var(--lat);font-style:italic;margin-bottom:.7rem}
.bp dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.25rem .85rem;margin:.35rem 0 0;font-size:.89rem}
.bp dt{font-family:var(--disp);font-size:.68rem;letter-spacing:.11em;color:var(--gold);padding-top:.35em;white-space:nowrap}
.bp dd{margin:0;color:var(--ink-2);font-family:var(--cn)}
.bp dd.key{color:var(--ink);border-left:2px solid var(--gold-l);padding-left:.55rem}
.bnav{display:flex;gap:.5rem;justify-content:space-between;margin-top:.9rem;padding-top:.65rem;border-top:1px dashed var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .85rem;font-size:.75rem;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend i{width:.7rem;height:.7rem;border-radius:2px;display:inline-block}
.cnt{font-family:var(--disp);font-size:.7rem;letter-spacing:.06em;margin-left:.25rem;opacity:.8}

/* ═══════════ 记忆引擎 ═══════════ */
.ldg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(60px,100%),1fr));gap:.3rem;margin:1rem 0}
.ld{cursor:pointer;border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:.28rem .18rem;
  text-align:center;font-family:var(--disp);font-size:.76rem;color:var(--ink-2);line-height:1.3;transition:transform .13s}
.ld small{display:block;font-family:var(--cn);font-size:.58rem;color:var(--ink-3)}
.ld:hover{border-color:var(--gold);transform:translateY(-2px)}
.ld[data-sec="0"]{border-bottom:3px solid var(--gold)}
.ld[data-sec="1"]{border-bottom:3px solid var(--burg)}
.ld[data-sec="2"]{border-bottom:3px solid var(--navy)}
.ld[data-sec="3"]{border-bottom:3px solid var(--green)}
.ld[aria-pressed="true"]{background:var(--card-2);border-color:var(--gold);color:var(--burg);font-weight:700}
.ldp{border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:.9rem 1.1rem;margin:.35rem 0 1.4rem;
  box-shadow:var(--sh-1);min-height:86px}
.ldp h4{margin:0 0 .15rem;font-size:1.04rem;color:var(--navy)}
.fw{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(258px,100%),1fr));gap:.85rem;margin:1rem 0}
.fc{perspective:1200px;min-height:176px;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit;position:relative}
.fc .in{position:relative;width:100%;height:100%;min-height:176px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.fc[aria-pressed="true"] .in{transform:rotateY(180deg)}
.fc .fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--rule);
  border-radius:10px;padding:.85rem .95rem;background:var(--card);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:.3rem;overflow:auto}
.fc .bkf{transform:rotateY(180deg);background:var(--card-2);border-color:var(--gold-l)}
.fc .qn{font-family:var(--disp);font-size:.67rem;letter-spacing:.14em;color:var(--gold)}
.fc .q{font-family:var(--cn);font-size:.93rem;font-weight:700;color:var(--ink)}
.fc .a{font-family:var(--cn);font-size:.82rem;color:var(--ink-2);line-height:1.6}
.fc .hint{font-family:var(--mono);font-size:.72rem;color:var(--burg);letter-spacing:.05em;margin-top:auto}
.fc .cue{font-size:.66rem;color:var(--ink-3);margin-top:auto;font-family:var(--disp);letter-spacing:.09em}
.fc.done .fa{border-color:var(--green)}
.mark{position:absolute;right:.4rem;top:.4rem;z-index:3;border:1px solid var(--rule-2);background:var(--card);
  border-radius:999px;font-size:.62rem;padding:.06rem .42rem;cursor:pointer;color:var(--ink-3);font-family:var(--disp)}
.mark[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.bar{height:7px;border-radius:99px;background:var(--rule);overflow:hidden;margin:.5rem 0 .2rem;max-width:var(--maxw)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-l),var(--green));width:0;transition:width .3s}

/* 自测 */
.quiz{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:1rem 1.15rem;margin:1.1rem 0;
  box-shadow:var(--sh-1);max-width:var(--maxw)}
.quiz .qh{font-family:var(--disp);font-size:.7rem;letter-spacing:.14em;color:var(--gold)}
.quiz .qq{font-family:var(--cn);font-weight:700;margin:.3rem 0 .6rem;font-size:1rem}
.opts{display:grid;gap:.35rem;margin:0;padding:0;list-style:none}
.opts button{width:100%;text-align:left;cursor:pointer;border:1px solid var(--rule-2);background:var(--card-2);
  border-radius:8px;padding:.45rem .7rem;font:inherit;font-size:.89rem;font-family:var(--cn);color:var(--ink-2)}
.opts button:hover{border-color:var(--gold)}
.opts button.ok{border-color:var(--green);background:rgba(44,92,49,.14);color:var(--ink)}
.opts button.no{border-color:var(--burg);background:rgba(122,34,48,.12);color:var(--ink)}
.qex{font-size:.85rem;color:var(--ink-2);margin-top:.6rem;border-left:3px solid var(--gold);padding-left:.6rem;display:none}
.qex.show{display:block}

details{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:.5rem .85rem;margin:.65rem 0;max-width:var(--maxw)}
details summary{cursor:pointer;font-family:var(--cn);font-weight:700;color:var(--navy);font-size:.93rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸";color:var(--gold);margin-right:.42em;display:inline-block;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
details > *:not(summary){font-size:.89rem}

/* ═══════════ 可视化：地图 · 流程 · 导图 · 动态图表 ═══════════ */
.viz{margin:1.5rem 0}
.vizbar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.1rem 0 .55rem}
.lyr{appearance:none;cursor:pointer;border:1px solid var(--rule-2);background:var(--card);color:var(--ink-2);
  font-family:var(--cn);font-size:.78rem;padding:.22rem .62rem;border-radius:999px;display:inline-flex;align-items:center;gap:.35rem}
.lyr i{width:.8rem;height:.22rem;border-radius:2px;background:var(--lc,var(--gold));display:inline-block}
.lyr:hover{border-color:var(--gold)}
.lyr[aria-pressed="true"]{background:var(--card-2);border-color:var(--lc,var(--gold));color:var(--ink);font-weight:700}
.vizbar .hint{font-size:.74rem;color:var(--ink-3);margin-left:.2rem}
svg .layer{opacity:0;transition:opacity .28s ease;pointer-events:none}
svg .layer.on{opacity:1}
svg .route{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset 1.5s cubic-bezier(.35,.1,.25,1)}
svg .layer.on .route{stroke-dashoffset:0}
svg .sea{fill:color-mix(in srgb,var(--teal) 16%,transparent)}
svg .land{fill:color-mix(in srgb,var(--gold-l) 17%,transparent);stroke:var(--rule-2);stroke-width:1.2}
svg .land2{fill:color-mix(in srgb,var(--olive) 15%,transparent);stroke:var(--rule-2);stroke-width:1.1}
svg .pin{fill:var(--card);stroke:var(--ink-2);stroke-width:1.6}
svg .lbl{font-size:10.4px;fill:var(--ink-2)}
svg .lbl-k{font-size:11px;font-weight:700;fill:var(--ink)}
svg .cap{font-size:10px;fill:var(--ink-3)}
svg .flowbox{fill:var(--card);stroke:var(--fc,var(--navy));stroke-width:1.8}
svg .flowtxt{font-size:11px;fill:var(--ink-2)}
svg .pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.42}}
svg .grow{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;transition:transform .9s cubic-bezier(.3,.9,.3,1)}
.run svg .grow{transform:scaleX(1)}
svg .fadeup{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.run svg .fadeup{opacity:1;transform:none}
svg .step{opacity:.22;transition:opacity .35s ease}
svg .step.lit{opacity:1}
.mindmap svg text{font-family:var(--cn)}
.barlbl{font-size:10px;fill:var(--ink-3)}
@media (prefers-reduced-motion:reduce){
  svg .route{transition:none;stroke-dashoffset:0}
  svg .grow{transition:none;transform:scaleX(1)}
  svg .fadeup{transition:none;opacity:1;transform:none}
  svg .pulse{animation:none;opacity:.3}
}
@media print{
  svg .layer{opacity:1!important} svg .route{stroke-dashoffset:0!important}
  svg .grow{transform:scaleX(1)!important} svg .fadeup{opacity:1!important;transform:none!important}
  svg .step{opacity:1!important}
}
footer{margin-top:3.6rem;padding:1.8rem 0 1rem;border-top:2px solid var(--rule);font-size:.83rem;color:var(--ink-3)}
.backtop{position:fixed;right:1rem;bottom:1rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.backtop.show{opacity:1;pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(20,14,4,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

@media (max-width:920px){
  body{font-size:16.5px;line-height:1.8}
  .wrap,.wrap[data-toc="off"]{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:60;inset:0 auto 0 0;width:min(86vw,330px);transform:translateX(-102%);opacity:1;
    background:var(--parch);box-shadow:14px 0 40px -24px rgba(0,0,0,.6);padding-top:.9rem}
  .wrap[data-toc="off"] .sidebar{transform:translateX(-102%);opacity:1;pointer-events:none}
  .sidebar.open,.wrap[data-toc="off"] .sidebar.open{transform:none;pointer-events:auto;opacity:1;overflow-y:auto}
  .canon{grid-template-columns:repeat(auto-fill,minmax(min(94px,100%),1fr))}
  .bp dl{grid-template-columns:minmax(0,1fr);gap:.02rem}
  .bp dt{padding-top:.5rem}
  .ldg{grid-template-columns:repeat(auto-fill,minmax(min(50px,100%),1fr))}
  .hide-sm{display:none}
}
@media (min-width:921px){.scrim{display:none}}

@media print{
  :root{--parch:#fff;--card:#fff;--card-2:#fff;--ink:#000;--ink-2:#222;--ink-3:#555;--rule:#bbb}
  body{background:#fff;font-size:10.4pt;line-height:1.5}
  .sidebar,.topbar,.backtop,.scrim,.filters,.bnav,.era-bar,.pal,.no-print,.mark{display:none!important}
  .wrap{display:block;max-width:none} main{padding:0}
  .part{break-before:page;border-top:0}
  h2,h3,h4{break-after:avoid}
  figure,table,.box,.bp,.quiz{break-inside:avoid}
  details{border:0;padding:0} details > *:not(summary){display:block!important}
  .ev.hide{display:block!important}
  .fc{min-height:0;display:block} .fc .in{transform:none!important}
  .fc .fa{position:static;transform:none!important;backface-visibility:visible;margin-bottom:.25rem}
  .qex{display:block!important}
  @page{size:A4;margin:15mm 13mm}
}
</style>
</head>
<body>
<div class="scrim" id="scrim" hidden></div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="全站搜索">
  <div class="pal-box">
    <input type="search" id="palIn" placeholder="搜索章节、经卷、术语、时间线事件、记忆卡…" aria-label="搜索">
    <ul class="pal-list" id="palList"></ul>
    <div class="pal-foot"><kbd>↑</kbd><kbd>↓</kbd> 选择　<kbd>Enter</kbd> 跳转　<kbd>Esc</kbd> 关闭</div>
  </div>
</div>
<div class="wrap" id="wrap" data-toc="on">
<nav class="sidebar" id="sidebar" aria-label="目录">
  <div class="toc-head"><b>目录</b><button class="btn" id="tocClose" aria-label="收起目录">收起</button></div>
  <ul class="toc" id="toc"></ul>
</nav>
<main>
<div class="topbar">
  <button class="btn" id="tocBtn" aria-expanded="true" aria-controls="sidebar">目录</button>
  <span class="crumb" id="crumb">圣经全解 · 欧陆改革宗</span>
  <button class="btn" id="searchBtn" aria-label="搜索全站">搜索 <kbd class="hide-sm">/</kbd></button>
  <button class="btn" id="themeBtn" aria-label="切换主题">主题</button>
  <span class="progress" id="prog"></span>
</div>
